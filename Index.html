<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1d2939; --muted: #667085;
      --primary: #1a73e8; --primary-dark: #1557b0; --ok: #12b76a; --err: #d92d20; --border: #e4e7ec;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 20px; margin: 0; }
    .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.08); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button { font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .55; cursor: default; }
    .btn { background: var(--primary); color: #fff; width: 100%; margin-top: 16px; }
    .btn:active { background: var(--primary-dark); }
    .btn-ghost { background: transparent; color: var(--primary); padding: 6px 8px; font-size: 14px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .pick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 8px; background: #eef4ff; color: var(--primary); border-radius: 12px; font-weight: 600; }
    .pick span.ic { font-size: 28px; }
    .hidden { display: none !important; }
    #preview { width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px; background: #000; margin-top: 12px; }
    .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
    .msg.err { background: #fef3f2; color: var(--err); }
    .msg.ok { background: #ecfdf3; color: #027a48; }
    .msg.info { background: #eff8ff; color: #175cd3; }
    .spinner { width: 18px; height: 18px; border: 3px solid #cfe0fc; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stat { display: flex; justify-content: space-between; align-items: baseline; }
    .stat b { font-size: 22px; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
    .list li:last-child { border-bottom: 0; }
    .list .t { font-weight: 600; }
    .list .s { font-size: 13px; color: var(--muted); }
    .list .a { font-weight: 700; white-space: nowrap; text-align: right; }
    .list a { font-size: 12px; color: var(--primary); }
    h2 { font-size: 16px; margin: 0 0 4px; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="loginView" class="hidden">
    <header><h1>💸 Expense Tracker</h1></header>
    <div class="card">
      <h2>Sign in</h2>
      <form id="loginForm">
        <label for="lUser">Username</label>
        <input id="lUser" autocomplete="username" autocapitalize="off" required>
        <label for="lPin">PIN / Password</label>
        <input id="lPin" type="password" autocomplete="current-password" required>
        <button class="btn" id="loginBtn" type="submit">Sign in</button>
      </form>
      <div id="loginMsg"></div>
    </div>
  </section>

  <!-- APP -->
  <section id="appView" class="hidden">
    <header>
      <h1>💸 Expenses</h1>
      <div><span id="who" class="s"></span> <button class="btn-ghost" id="logoutBtn">Sign out</button></div>
    </header>

    <div class="card">
      <h2>Scan a receipt</h2>
      <div class="row" style="margin-top:10px">
        <label class="pick" for="camInput"><span class="ic">📷</span>Take photo</label>
        <label class="pick" for="fileInput"><span class="ic">🖼️</span>Upload image</label>
      </div>
      <input id="camInput" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="fileInput" type="file" accept="image/*" class="hidden">
      <img id="preview" class="hidden" alt="Receipt preview">
      <div id="scanMsg"></div>
      <button class="btn-ghost" id="manualBtn" style="margin-top:8px">or enter manually</button>
    </div>

    <div class="card hidden" id="formCard">
      <h2>Check &amp; save</h2>
      <form id="expForm">
        <div class="row">
          <div><label for="fDate">Date</label><input id="fDate" type="date" required></div>
          <div><label for="fAmount">Amount</label><input id="fAmount" type="number" step="0.01" min="0.01" inputmode="decimal" required></div>
        </div>
        <label for="fPayTo">Pay to</label>
        <input id="fPayTo" required maxlength="200">
        <label for="fItem">Item</label>
        <input id="fItem" maxlength="300">
        <label for="fCategory">Category</label>
        <select id="fCategory"></select>
        <button class="btn" id="saveBtn" type="submit">Save to Google Sheet</button>
      </form>
      <div id="saveMsg"></div>
    </div>

    <div class="card">
      <div class="stat"><h2>This month</h2><b id="monthTotal">–</b></div>
      <ul class="list" id="recentList"></ul>
    </div>
  </section>
</div>

<script>
  const MAX_DIM = 1600;           // resize photos before upload
  const JPEG_QUALITY = 0.85;
  let session = null;             // {token, username, role, categories}
  let currentFileId = null;

  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem('expToken'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem('expToken', v); } catch (e) {} },
    clear() { try { localStorage.removeItem('expToken'); } catch (e) {} }
  };

  // Promise wrapper around google.script.run
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(err => {
        if (String(err && err.message).includes('SESSION_EXPIRED')) { signOut(true); }
        reject(err);
      })[fn](...args);
    });
  }

  function msg(el, type, text, spin) {
    $(el).innerHTML = '';
    if (!text) return;
    const d = document.createElement('div');
    d.className = 'msg ' + type;
    if (spin) { const s = document.createElement('span'); s.className = 'spinner'; d.appendChild(s); }
    d.appendChild(document.createTextNode(text));
    $(el).appendChild(d);
  }
  const errText = e => String((e && e.message) || e).replace(/^Exception:\s*/, '');
  const money = n => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* ---------- Auth ---------- */
  function showApp() {
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('who').textContent = session.username + (session.role === 'admin' ? ' (admin)' : '');
    const sel = $('fCategory'); sel.innerHTML = '';
    session.categories.forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c; sel.appendChild(o); });
    loadRecent();
  }
  function showLogin() {
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
  }
  function signOut(expired) {
    if (session && !expired) google.script.run.logout(session.token);
    session = null; store.clear(); showLogin();
    if (expired) msg('loginMsg', 'info', 'Session expired, please sign in again.');
  }

  $('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('loginBtn').disabled = true; msg('loginMsg', 'info', 'Signing in…', true);
    try {
      session = await call('login', $('lUser').value, $('lPin').value);
      store.set(session.token); $('lPin').value = ''; msg('loginMsg');
      showApp();
    } catch (e) { msg('loginMsg', 'err', errText(e)); }
    $('loginBtn').disabled = false;
  });
  $('logoutBtn').addEventListener('click', () => signOut(false));

  /* ---------- Image capture + scan ---------- */
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read this image. Try a JPG or PNG.')); };
      img.src = url;
    });
  }

  async function handleFile(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    try {
      msg('scanMsg', 'info', 'Preparing image…', true);
      const dataUrl = await resizeImage(file);
      $('preview').src = dataUrl; $('preview').classList.remove('hidden');
      msg('scanMsg', 'info', 'Reading receipt… (5-15 sec)', true);
      const res = await call('scanReceipt', session.token, dataUrl.split(',')[1], 'image/jpeg');
      currentFileId = res.fileId;
      fillForm(res.data);
      if (res.warning) msg('scanMsg', 'info', res.warning);
      else msg('scanMsg', 'ok', 'Receipt read. Please check the details below.');
    } catch (e) {
      msg('scanMsg', 'err', 'Scan failed: ' + errText(e));
    }
  }
  $('camInput').addEventListener('change', e => handleFile(e.target));
  $('fileInput').addEventListener('change', e => handleFile(e.target));
  $('manualBtn').addEventListener('click', () => {
    currentFileId = null; $('preview').classList.add('hidden'); msg('scanMsg');
    fillForm({ date: new Date().toISOString().slice(0, 10), payTo: '', item: '', amount: '', category: 'Others' });
  });

  function fillForm(d) {
    $('fDate').value = d.date || '';
    $('fPayTo').value = d.payTo || '';
    $('fItem').value = d.item || '';
    $('fAmount').value = d.amount || '';
    $('fCategory').value = d.category || 'Others';
    msg('saveMsg');
    $('formCard').classList.remove('hidden');
    $('formCard').scrollIntoView({ behavior: 'smooth' });
  }

  /* ---------- Save ---------- */
  $('expForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('saveBtn').disabled = true; msg('saveMsg', 'info', 'Saving…', true);
    try {
      await call('saveExpense', session.token, {
        date: $('fDate').value, payTo: $('fPayTo').value, item: $('fItem').value,
        amount: $('fAmount').value, category: $('fCategory').value
      }, currentFileId);
      msg('saveMsg', 'ok', 'Saved to Google Sheet ✔');
      $('expForm').reset(); currentFileId = null;
      $('preview').classList.add('hidden'); msg('scanMsg');
      setTimeout(() => $('formCard').classList.add('hidden'), 1200);
      loadRecent();
    } catch (e) { msg('saveMsg', 'err', errText(e)); }
    $('saveBtn').disabled = false;
  });

  /* ---------- Recent list ---------- */
  async function loadRecent() {
    try {
      const r = await call('getRecentExpenses', session.token);
      $('monthTotal').textContent = money(r.monthTotal);
      const ul = $('recentList'); ul.innerHTML = '';
      if (!r.items.length) { const li = document.createElement('li'); li.className = 's'; li.textContent = 'No expenses yet.'; ul.appendChild(li); return; }
      r.items.forEach(x => {
        const li = document.createElement('li');
        const left = document.createElement('div');
        const t = document.createElement('div'); t.className = 't'; t.textContent = x.payTo;
        const s = document.createElement('div'); s.className = 's';
        s.textContent = x.date + ' · ' + x.category + (x.item ? ' · ' + x.item : '') + (session.role === 'admin' ? ' · ' + x.user : '');
        left.append(t, s);
        const right = document.createElement('div'); right.className = 'a';
        right.appendChild(document.createTextNode(money(x.amount)));
        if (x.receipt) {
          const a = document.createElement('a'); a.href = x.receipt; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'receipt';
          right.appendChild(document.createElement('br')); right.appendChild(a);
        }
        li.append(left, right); ul.appendChild(li);
      });
    } catch (e) { /* non-critical */ }
  }

  /* ---------- Start ---------- */
  (async () => {
    const t = store.get();
    if (t) {
      try { session = await call('resumeSession', t); showApp(); return; } catch (e) { store.clear(); }
    }
    showLogin();
  })();
</script>
</body>
</html>
